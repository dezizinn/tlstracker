<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>TLS Workout Tracker</title>

<!-- PWA manifest -->
<link rel="manifest" href="manifest.json">

<!-- iOS PWA support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TLS Tracker">
<link rel="apple-touch-icon" href="icon-180.png">

<!-- Theme color (colors Safari UI chrome) -->
<meta name="theme-color" content="#7B3FA0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --purple: #7B3FA0; --purple-mid: #c084e0; --purple-light: #f3e8f9;
    --green: #1A7A52; --amber: #B87A0A; --blue: #1A5FA0;
    --teal: #0e8585; --teal-mid: #2dd4d4;
    --bg: #0f0f13; --surface: #18181f; --surface2: #222230;
    --border: rgba(255,255,255,0.08); --text: #f0eef8; --muted: #8884a8;
    --input-bg: #1e1e2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }

  /* Header */
  .header { position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 16px 10px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 10px; }
  .header-logo { width: 32px; height: 32px; border-radius: 8px; background: var(--purple); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: #fff; flex-shrink: 0; }
  .header-title { font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
  .header-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .week-badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 600; color: var(--purple-mid); font-family: 'DM Mono', monospace; cursor: pointer; user-select: none; }

  /* Location toggle */
  .loc-toggle { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 3px; gap: 2px; }
  .loc-btn { padding: 4px 11px; border-radius: 16px; font-size: 11px; font-weight: 700; border: none; background: none; cursor: pointer; transition: all .18s; color: var(--muted); font-family: 'Syne', sans-serif; white-space: nowrap; }
  .loc-btn.active-gym { background: var(--purple); color: #fff; }
  .loc-btn.active-home { background: var(--teal); color: #fff; }

  /* Day tabs */
  .day-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 12px 16px; scrollbar-width: none; border-bottom: 1px solid var(--border); background: var(--bg); }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab { flex-shrink: 0; padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; transition: all .15s; white-space: nowrap; }
  .day-tab.active { color: #fff; border-color: transparent; }
  .day-tab[data-color="purple"].active { background: var(--purple); }
  .day-tab[data-color="green"].active { background: var(--green); }
  .day-tab[data-color="amber"].active { background: var(--amber); }
  .day-tab[data-color="blue"].active { background: var(--blue); }

  /* Location banner under day tabs */
  .loc-banner { display: flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--border); }
  .loc-banner.gym { background: rgba(123,63,160,.08); color: var(--purple-mid); }
  .loc-banner.home { background: rgba(14,133,133,.08); color: var(--teal-mid); }
  .loc-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .loc-banner.gym .loc-dot { background: var(--purple-mid); }
  .loc-banner.home .loc-dot { background: var(--teal-mid); }

  /* Content */
  .content { padding: 16px; max-width: 600px; margin: 0 auto; }
  .day-title { font-size: 22px; font-weight: 800; letter-spacing: -.5px; margin-bottom: 4px; }
  .day-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }

  /* Exercise card */
  .ex-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
  .ex-card.home-card { border-color: rgba(14,133,133,.25); }
  .ex-header { padding: 14px 16px 10px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .ex-name { font-size: 15px; font-weight: 700; line-height: 1.3; flex: 1; }
  .ex-badges { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .ex-target { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 10px; }
  .ex-target.heavy { background: rgba(123,63,160,.25); color: var(--purple-mid); }
  .ex-target.light { background: rgba(26,95,160,.2); color: #7ab4f0; }
  .ex-target.home-heavy { background: rgba(14,133,133,.25); color: var(--teal-mid); }
  .ex-target.home-light { background: rgba(14,133,133,.12); color: #5ebebe; }
  .eq-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 8px; font-family: 'DM Mono', monospace; }
  .eq-db   { background: rgba(123,63,160,.2); color: var(--purple-mid); }
  .eq-bw   { background: rgba(26,122,82,.2);  color: #4ade9a; }
  .eq-band { background: rgba(184,122,10,.2); color: #f5c25a; }
  .ex-tip  { font-size: 11px; color: var(--muted); padding: 0 16px 10px; line-height: 1.5; font-style: italic; }

  /* Sets table */
  .sets-table { padding: 0 16px 14px; }
  .sets-header { display: grid; grid-template-columns: 30px 1fr 1fr 32px; gap: 6px; padding: 0 0 6px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border-bottom: 1px solid var(--border); margin-bottom: 8px; }
  .set-row { display: grid; grid-template-columns: 30px 1fr 1fr 32px; gap: 6px; align-items: center; margin-bottom: 7px; }
  .set-num { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; color: var(--muted); text-align: center; }
  .set-input { background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; padding: 9px 10px; width: 100%; text-align: center; outline: none; transition: border-color .15s; -webkit-appearance: none; }
  .set-input:focus { border-color: var(--purple-mid); }
  .set-input.home-input:focus { border-color: var(--teal-mid); }
  .set-input::placeholder { color: #3a3a55; font-size: 13px; }
  .po-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); margin: 0 auto; transition: all .2s; }
  .po-dot.hit { background: #4ade80; border-color: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,.5); }

  /* Timer */
  .timer-row { display: flex; gap: 8px; padding: 0 16px 14px; }
  .timer-btn { flex: 1; padding: 9px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .timer-btn:active { transform: scale(.97); }

  /* PO banner */
  .po-banner { border-radius: 10px; padding: 10px 14px; font-size: 12px; font-weight: 600; margin-bottom: 12px; display: none; }
  .po-banner.show { display: block; }
  .po-banner.gym-po { background: rgba(74,222,128,.1); border: 1px solid rgba(74,222,128,.3); color: #4ade80; }
  .po-banner.home-po { background: rgba(14,133,133,.1); border: 1px solid rgba(14,133,133,.35); color: var(--teal-mid); }

  /* Notes */
  .notes-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 16px 4px; }
  .notes-input { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'Syne', sans-serif; font-size: 13px; padding: 10px 12px; outline: none; resize: none; transition: border-color .15s; }
  .notes-input:focus { border-color: var(--purple-mid); }
  .notes-input.home-input:focus { border-color: var(--teal-mid); }

  /* Progress tab */
  .lift-row { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .lift-name { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .week-dots { display: flex; gap: 5px; flex-wrap: wrap; }
  .week-dot { width: 36px; height: 36px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; color: var(--muted); flex-direction: column; line-height: 1.2; }
  .week-dot.gym-data { color: var(--text); border-color: var(--purple-mid); background: rgba(123,63,160,.12); }
  .week-dot.home-data { color: var(--text); border-color: var(--teal-mid); background: rgba(14,133,133,.12); }
  .dot-wk { font-size: 7px; color: var(--muted); }
  .dot-loc { font-size: 7px; margin-top: 1px; }
  .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 10px; margin-top: 20px; }

  /* Bottom nav */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; padding-bottom: env(safe-area-inset-bottom, 0); z-index: 50; }
  .nav-btn { flex: 1; padding: 12px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--muted); font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 600; cursor: pointer; }
  .nav-btn.active { color: var(--purple-mid); }
  .nav-icon { font-size: 20px; }

  /* Week modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); border-radius: 20px 20px 0 0; border: 1px solid var(--border); padding: 20px 16px 32px; width: 100%; transform: translateY(100%); transition: transform .25s ease; }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; text-align: center; }
  .week-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .week-select-btn { aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 2px; }
  .week-select-btn.active { background: var(--purple); color: #fff; border-color: var(--purple); }
  .week-select-btn .wk-loc { font-size: 8px; }

  /* Views */
  .view { display: none; }
  .view.active { display: block; }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">T</div>
  <div>
    <div class="header-title">TLS Tracker</div>
    <div class="header-sub">Thinner Leaner Stronger</div>
  </div>
  <div class="header-right">
    <div class="loc-toggle">
      <button class="loc-btn active-gym" id="btnGym" onclick="setLocation('gym')">🏋️ Gym</button>
      <button class="loc-btn" id="btnHome" onclick="setLocation('home')">🏠 Home</button>
    </div>
    <div class="week-badge" onclick="openWeekModal()" id="weekBadge">Week 1</div>
  </div>
</div>

<div id="viewWorkout" class="view active">
  <div class="day-tabs" id="dayTabs"></div>
  <div id="locBanner" class="loc-banner gym">
    <div class="loc-dot"></div>
    <span id="locBannerText">Gym workout — barbell exercises</span>
  </div>
  <div class="content" id="workoutContent"></div>
</div>

<div id="viewProgress" class="view">
  <div class="content">
    <div class="day-title" style="margin-bottom:4px">Progress</div>
    <div class="day-sub" style="margin-bottom:4px">Compound lift weights over 12 weeks</div>
    <div style="display:flex;gap:12px;margin-bottom:20px;font-size:11px;font-weight:600;">
      <span style="color:var(--purple-mid)">■ Gym</span>
      <span style="color:var(--teal-mid)">■ Home</span>
    </div>
    <div id="progressContent"></div>
  </div>
</div>

<div class="bottom-nav">
  <button class="nav-btn active" onclick="switchView('workout')" id="navWorkout"><span class="nav-icon">🏋️</span>Workout</button>
  <button class="nav-btn" onclick="switchView('progress')" id="navProgress"><span class="nav-icon">📈</span>Progress</button>
</div>

<div class="modal-overlay" id="weekModal" onclick="closeWeekModal(event)">
  <div class="modal">
    <div class="modal-title">Select Week</div>
    <div class="week-grid" id="weekGrid"></div>
  </div>
</div>

<script>
// ── Data ──────────────────────────────────────────────────────────────────
const GYM_DAYS = [
  { id:'d1', label:'Day 1', title:'Day 1 — Push', sub:'Chest Focus', color:'purple',
    exercises:[
      {name:'Barbell bench press',        target:'3×4–6',  sets:3, heavy:true},
      {name:'Incline barbell bench press',target:'3×4–6',  sets:3, heavy:true},
      {name:'Dumbbell bench press',       target:'3×8–10', sets:3, heavy:false},
      {name:'Triceps pushdown',           target:'3×8–10', sets:3, heavy:false},
      {name:'Overhead triceps extension', target:'2×8–10', sets:2, heavy:false},
    ]},
  { id:'d2', label:'Day 2', title:'Day 2 — Pull', sub:'Back Focus', color:'green',
    exercises:[
      {name:'Barbell deadlift',  target:'3×4–6',  sets:3, heavy:true},
      {name:'Barbell row',       target:'3×4–6',  sets:3, heavy:true},
      {name:'Lat pulldown',      target:'3×8–10', sets:3, heavy:false},
      {name:'Seated cable row',  target:'3×8–10', sets:3, heavy:false},
      {name:'Dumbbell curl',     target:'3×8–10', sets:3, heavy:false},
    ]},
  { id:'d3', label:'Day 3', title:'Day 3 — Legs', sub:'Squat Focus', color:'amber',
    exercises:[
      {name:'Barbell squat',     target:'3×4–6',  sets:3, heavy:true},
      {name:'Romanian deadlift', target:'3×4–6',  sets:3, heavy:true},
      {name:'Leg press',         target:'3×8–10', sets:3, heavy:false},
      {name:'Leg curl',          target:'3×8–10', sets:3, heavy:false},
      {name:'Calf raise',        target:'4×8–10', sets:4, heavy:false},
    ]},
  { id:'d5', label:'Day 5', title:'Day 5 — Push', sub:'Shoulder Focus', color:'purple',
    exercises:[
      {name:'Seated dumbbell press',     target:'3×4–6',  sets:3, heavy:true},
      {name:'Side lateral raise',        target:'3×8–10', sets:3, heavy:false},
      {name:'Bent-over rear delt raise', target:'3×8–10', sets:3, heavy:false},
      {name:'Triceps pushdown',          target:'3×8–10', sets:3, heavy:false},
      {name:'Overhead triceps extension',target:'2×8–10', sets:2, heavy:false},
    ]},
  { id:'d6', label:'Day 6', title:'Day 6 — Upper', sub:'Arms Focus', color:'blue',
    exercises:[
      {name:'Incline dumbbell curl',      target:'3×8–10',  sets:3, heavy:false},
      {name:'Hammer curl',                target:'3×8–10',  sets:3, heavy:false},
      {name:'Triceps pushdown',           target:'3×8–10',  sets:3, heavy:false},
      {name:'Overhead triceps extension', target:'3×8–10',  sets:3, heavy:false},
      {name:'Face pull',                  target:'3×10–12', sets:3, heavy:false},
    ]},
];

const HOME_DAYS = [
  { id:'d1', label:'Day 1', title:'Day 1 — Push', sub:'Chest Focus · Home', color:'purple',
    exercises:[
      {name:'DB Floor Press',              target:'3×8–10', sets:3, heavy:true,  eq:'DB',   tip:'Elbows 45° from body; pause at bottom'},
      {name:'Incline DB Press',            target:'3×8–10', sets:3, heavy:true,  eq:'DB',   tip:'Prop torso ~30° on pillows or a chair'},
      {name:'Push-Up (weighted/feet-up)',  target:'3×10–15',sets:3, heavy:false, eq:'BW',   tip:'Slow 3-sec descent; add backpack for load'},
      {name:'Band Triceps Pushdown',       target:'3×12–15',sets:3, heavy:false, eq:'BAND', tip:'Anchor band overhead; keep elbows locked in'},
      {name:'DB Triceps Kickback',         target:'2×12–15',sets:2, heavy:false, eq:'DB',   tip:'Hinge at hips; upper arm parallel to floor'},
    ]},
  { id:'d2', label:'Day 2', title:'Day 2 — Pull', sub:'Back Focus · Home', color:'green',
    exercises:[
      {name:'DB Romanian Deadlift', target:'3×8–10', sets:3, heavy:true,  eq:'DB',   tip:'Hip hinge, soft knee; feel the hamstring stretch'},
      {name:'DB Bent-Over Row',     target:'3×8–10', sets:3, heavy:true,  eq:'DB',   tip:'Chest parallel to floor; pull to hip not chest'},
      {name:'Band Lat Pulldown',    target:'3×12–15',sets:3, heavy:false, eq:'BAND', tip:'Anchor above; pull elbows down and back'},
      {name:'Band Seated Row',      target:'3×12–15',sets:3, heavy:false, eq:'BAND', tip:'Wrap around feet; pull to navel, squeeze back'},
      {name:'DB Hammer Curl',       target:'3×10–12',sets:3, heavy:false, eq:'DB',   tip:'Neutral grip; controlled 2-sec lower'},
    ]},
  { id:'d3', label:'Day 3', title:'Day 3 — Legs', sub:'Squat Focus · Home', color:'amber',
    exercises:[
      {name:'DB Goblet Squat',          target:'3×10–12',sets:3, heavy:true,  eq:'DB',   tip:'Hold DB at chest; squat deep, knees out'},
      {name:'DB Romanian Deadlift',     target:'3×10–12',sets:3, heavy:true,  eq:'DB',   tip:'Slow descent; drive through heels'},
      {name:'DB Bulgarian Split Squat', target:'3×10–12',sets:3, heavy:false, eq:'DB',   tip:'Rear foot elevated; front shin vertical'},
      {name:'Band Leg Curl (prone)',    target:'3×12–15',sets:3, heavy:false, eq:'BAND', tip:'Anchor band low; curl heels toward glutes'},
      {name:'Single-Leg Calf Raise',   target:'4×15–20',sets:4, heavy:false, eq:'BW',   tip:'Stand on step edge; full range of motion'},
    ]},
  { id:'d5', label:'Day 5', title:'Day 5 — Push', sub:'Shoulder Focus · Home', color:'purple',
    exercises:[
      {name:'DB Seated Overhead Press',    target:'3×8–10', sets:3, heavy:true,  eq:'DB',   tip:'Sit upright; press straight overhead'},
      {name:'DB Lateral Raise',            target:'3×12–15',sets:3, heavy:false, eq:'DB',   tip:'Slight elbow bend; lead with pinky side up'},
      {name:'Band Face Pull',              target:'3×12–15',sets:3, heavy:false, eq:'BAND', tip:'Anchor at face height; pull to ears, elbows high'},
      {name:'DB Triceps Overhead Ext.',    target:'3×12–15',sets:3, heavy:false, eq:'DB',   tip:'Both hands on one DB; keep elbows tucked'},
      {name:'Pike Push-Up',               target:'2×10–12',sets:2, heavy:false, eq:'BW',   tip:'Hips high, head toward floor; shoulder-dominant'},
    ]},
  { id:'d6', label:'Day 6', title:'Day 6 — Upper', sub:'Arms Focus · Home', color:'blue',
    exercises:[
      {name:'Incline DB Curl',           target:'3×10–12',sets:3, heavy:false, eq:'DB',   tip:'Full stretch at bottom; controlled tempo'},
      {name:'DB Hammer Curl',            target:'3×10–12',sets:3, heavy:false, eq:'DB',   tip:'Neutral grip; alternate or bilateral'},
      {name:'Band Biceps Curl',          target:'3×12–15',sets:3, heavy:false, eq:'BAND', tip:'Stand on band; squeeze at top'},
      {name:'DB Triceps Kickback',       target:'3×12–15',sets:3, heavy:false, eq:'DB',   tip:'Both arms; upper arm pinned to side'},
      {name:'Band Rear Delt Pull-Apart', target:'3×15',   sets:3, heavy:false, eq:'BAND', tip:'Arms at shoulder height; pull band wide apart'},
    ]},
];

const PROGRESS_LIFTS = [
  {name:'Barbell bench press / DB Floor Press',     gymDay:'d1', gymIdx:0, homeDay:'d1', homeIdx:0},
  {name:'Barbell deadlift / DB Romanian Deadlift',  gymDay:'d2', gymIdx:0, homeDay:'d2', homeIdx:0},
  {name:'Barbell row / DB Bent-Over Row',           gymDay:'d2', gymIdx:1, homeDay:'d2', homeIdx:1},
  {name:'Barbell squat / DB Goblet Squat',          gymDay:'d3', gymIdx:0, homeDay:'d3', homeIdx:0},
  {name:'Seated DB Press (both)',                   gymDay:'d5', gymIdx:0, homeDay:'d5', homeIdx:0},
];

// ── State ─────────────────────────────────────────────────────────────────
let currentWeek = 1;
let currentDay  = 'd1';
let currentLoc  = 'gym'; // 'gym' | 'home'
let currentView = 'workout';

// ── Storage ───────────────────────────────────────────────────────────────
function key(week, loc, dayId, exIdx, setIdx, field) {
  return `tls_w${week}_${loc}_${dayId}_e${exIdx}_s${setIdx}_${field}`;
}
function noteKey(week, loc, dayId, exIdx) {
  return `tls_w${week}_${loc}_${dayId}_e${exIdx}_note`;
}
function locKey(week, dayId) { return `tls_w${week}_loc_${dayId}`; }
function save(k, v) { try { localStorage.setItem(k, v); } catch(e){} }
function load(k) { try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }

// ── Location toggle ───────────────────────────────────────────────────────
function setLocation(loc) {
  currentLoc = loc;
  // Save this choice for week+day combo
  save(locKey(currentWeek, currentDay), loc);
  document.getElementById('btnGym').className  = 'loc-btn' + (loc === 'gym'  ? ' active-gym'  : '');
  document.getElementById('btnHome').className = 'loc-btn' + (loc === 'home' ? ' active-home' : '');
  updateLocBanner();
  buildWorkout();
}

function updateLocBanner() {
  const banner = document.getElementById('locBanner');
  const text   = document.getElementById('locBannerText');
  banner.className = `loc-banner ${currentLoc}`;
  text.textContent = currentLoc === 'gym'
    ? 'Gym workout — barbell exercises'
    : 'Home workout — dumbbells, bands & bodyweight';
}

function loadLocationForDay() {
  const saved = load(locKey(currentWeek, currentDay));
  currentLoc = saved || 'gym';
  document.getElementById('btnGym').className  = 'loc-btn' + (currentLoc === 'gym'  ? ' active-gym'  : '');
  document.getElementById('btnHome').className = 'loc-btn' + (currentLoc === 'home' ? ' active-home' : '');
  updateLocBanner();
}

// ── Day tabs ──────────────────────────────────────────────────────────────
function buildTabs() {
  const tabs = document.getElementById('dayTabs');
  const days = GYM_DAYS; // tabs always same days
  tabs.innerHTML = days.map(d => `
    <div class="day-tab${d.id === currentDay ? ' active' : ''}" data-color="${d.color}" onclick="switchDay('${d.id}')">
      ${d.label}
    </div>`).join('');
}

// ── Workout content ───────────────────────────────────────────────────────
function getDays() { return currentLoc === 'home' ? HOME_DAYS : GYM_DAYS; }

function buildWorkout() {
  const days = getDays();
  const day  = days.find(d => d.id === currentDay);
  const content = document.getElementById('workoutContent');
  const isHome  = currentLoc === 'home';

  const poBanner = checkPOStatus(day);
  const accentColor = isHome ? 'var(--teal-mid)' : `var(--${day.color === 'purple' ? 'purple' : day.color === 'green' ? 'green' : day.color === 'amber' ? 'amber' : 'blue'})`;

  let html = `
    <div class="day-title" style="color:${accentColor}">${day.title}</div>
    <div class="day-sub">${day.sub} · Week ${currentWeek}</div>
    ${poBanner ? `<div class="po-banner show ${isHome ? 'home-po' : 'gym-po'}">${poBanner}</div>` : ''}
  `;

  day.exercises.forEach((ex, exIdx) => {
    const eqMap = {DB:'eq-db', BW:'eq-bw', BAND:'eq-band'};
    const eqLabel = {DB:'DB', BW:'BW', BAND:'BAND'};
    html += `
      <div class="ex-card${isHome ? ' home-card' : ''}">
        <div class="ex-header">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-badges">
            <span class="ex-target ${isHome ? (ex.heavy ? 'home-heavy' : 'home-light') : (ex.heavy ? 'heavy' : 'light')}">${ex.target}</span>
            ${isHome && ex.eq ? `<span class="eq-badge ${eqMap[ex.eq]}">${eqLabel[ex.eq]}</span>` : ''}
          </div>
        </div>
        ${isHome && ex.tip ? `<div class="ex-tip">💡 ${ex.tip}</div>` : ''}
        <div class="sets-table">
          <div class="sets-header">
            <div style="text-align:center">Set</div>
            <div style="text-align:center">${isHome ? 'Wt / Band' : 'Weight'}</div>
            <div style="text-align:center">Reps</div>
            <div style="text-align:center" title="Progressive overload">PO</div>
          </div>`;

    for (let s = 0; s < ex.sets; s++) {
      const wVal  = load(key(currentWeek, currentLoc, currentDay, exIdx, s, 'w'));
      const rVal  = load(key(currentWeek, currentLoc, currentDay, exIdx, s, 'r'));
      const topR  = ex.target.match(/[–-](\d+)/)?.[1] || ex.target.match(/×(\d+)/)?.[1] || '10';
      const hitTop = rVal && parseInt(rVal) >= parseInt(topR);
      html += `
        <div class="set-row">
          <div class="set-num">${s+1}</div>
          <input class="set-input${isHome ? ' home-input' : ''}" type="number" inputmode="decimal"
            placeholder="${isHome && ex.eq === 'BW' ? 'BW' : 'lbs'}"
            value="${wVal}"
            onchange="saveVal('${currentLoc}',${exIdx},${s},'w',this.value);checkPO()"
            onfocus="this.select()">
          <input class="set-input${isHome ? ' home-input' : ''}" type="number" inputmode="numeric"
            placeholder="reps" value="${rVal}"
            onchange="saveVal('${currentLoc}',${exIdx},${s},'r',this.value);checkPO()"
            onfocus="this.select()">
          <div class="po-dot${hitTop ? ' hit' : ''}" id="po_${exIdx}_${s}"></div>
        </div>`;
    }

    html += `</div>
      <div class="timer-row">
        <button class="timer-btn" onclick="startTimer(${ex.heavy ? 210 : 90})">
          ⏱ ${ex.heavy ? '3–4 min rest' : '1–2 min rest'}
        </button>
      </div>`;

    const noteVal = load(noteKey(currentWeek, currentLoc, currentDay, exIdx));
    html += `
      <div class="notes-label">Notes</div>
      <div style="padding:0 16px 14px">
        <textarea class="notes-input${isHome ? ' home-input' : ''}" rows="2"
          placeholder="Form cues, how it felt..."
          onchange="save(noteKey(${currentWeek},'${currentLoc}','${currentDay}',${exIdx}),this.value)"
        >${noteVal}</textarea>
      </div>
    </div>`;
  });

  content.innerHTML = html;
}

function saveVal(loc, exIdx, setIdx, field, val) {
  save(key(currentWeek, loc, currentDay, exIdx, setIdx, field), val);
}

function checkPO() {
  const day = getDays().find(d => d.id === currentDay);
  day.exercises.forEach((ex, exIdx) => {
    const topR = ex.target.match(/[–-](\d+)/)?.[1] || ex.target.match(/×(\d+)/)?.[1] || '10';
    for (let s = 0; s < ex.sets; s++) {
      const rVal = load(key(currentWeek, currentLoc, currentDay, exIdx, s, 'r'));
      const dot  = document.getElementById(`po_${exIdx}_${s}`);
      if (dot) dot.classList.toggle('hit', !!(rVal && parseInt(rVal) >= parseInt(topR)));
    }
  });
}

function checkPOStatus(day) {
  if (currentWeek <= 1) return null;
  const prev = currentWeek - 1;
  const msgs = [];
  day.exercises.filter(e => e.heavy).forEach((ex, exIdx) => {
    const topR   = ex.target.match(/[–-](\d+)/)?.[1] || '6';
    const allHit = Array.from({length: ex.sets}, (_, s) => {
      const r = load(key(prev, currentLoc, currentDay, exIdx, s, 'r'));
      return r && parseInt(r) >= parseInt(topR);
    }).every(Boolean);
    if (allHit) {
      const prevWt = load(key(prev, currentLoc, currentDay, exIdx, 0, 'w'));
      if (prevWt) {
        const add = /squat|deadlift|leg/i.test(ex.name) ? 10 : 5;
        msgs.push(`${ex.name}: +${add} lbs → try ${parseFloat(prevWt) + add} lbs`);
      }
    }
  });
  if (!msgs.length) return null;
  const icon = currentLoc === 'home' ? '🏠' : '💪';
  return `${icon} Add weight this week! ${msgs.join(' · ')}`;
}

// ── Timer ─────────────────────────────────────────────────────────────────
function startTimer(seconds) {
  if (toastEl) toastEl.remove();
  toastEl = document.createElement('div');
  toastEl.style.cssText = `position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
    background:#18181f;border:1px solid rgba(123,63,160,.6);border-radius:14px;
    padding:10px 20px;font-family:'DM Mono',monospace;font-size:15px;font-weight:500;
    color:#c084e0;z-index:200;display:flex;gap:10px;align-items:center;
    box-shadow:0 4px 24px rgba(0,0,0,.5);white-space:nowrap;`;
  document.body.appendChild(toastEl);
  let remaining = seconds;
  function tick() {
    const m = Math.floor(remaining / 60), s = remaining % 60;
    toastEl.innerHTML = `⏱ <span>${m}:${s.toString().padStart(2,'0')}</span> <span style="color:#555;font-size:12px;cursor:pointer" onclick="this.closest('div').remove();clearInterval(window._ti)">✕</span>`;
    if (remaining-- <= 0) { clearInterval(window._ti); toastEl.innerHTML='✅ Rest done!'; setTimeout(()=>toastEl&&toastEl.remove(),2000); }
  }
  let toastEl2 = toastEl;
  tick(); clearInterval(window._ti); window._ti = setInterval(tick, 1000);
}
let toastEl = null;

// ── Progress view ─────────────────────────────────────────────────────────
function buildProgress() {
  const content = document.getElementById('progressContent');
  let html = '';
  PROGRESS_LIFTS.forEach(lift => {
    html += `<div class="lift-row"><div class="lift-name">${lift.name}</div><div class="week-dots">`;
    for (let w = 1; w <= 12; w++) {
      const gymWt  = load(key(w, 'gym',  lift.gymDay,  lift.gymIdx,  0, 'w'));
      const homeWt = load(key(w, 'home', lift.homeDay, lift.homeIdx, 0, 'w'));
      const hasGym  = !!gymWt;
      const hasHome = !!homeWt;
      const cls = hasGym ? 'gym-data' : hasHome ? 'home-data' : '';
      const dispWt  = hasGym ? gymWt : hasHome ? homeWt : '';
      const locIcon = hasGym ? '🏋️' : hasHome ? '🏠' : '';
      html += `<div class="week-dot ${cls}" title="W${w}: ${hasGym?'Gym '+gymWt+' lbs':''}${hasHome?' Home '+homeWt+' lbs':''}${!hasGym&&!hasHome?'no data':''}">
        ${dispWt ? `<span style="font-size:9px">${dispWt}</span>` : ''}
        <span class="dot-wk">W${w}</span>
        ${locIcon ? `<span class="dot-loc">${locIcon}</span>` : ''}
      </div>`;
    }
    html += `</div></div>`;
  });
  content.innerHTML = html;
}

// ── Week modal ────────────────────────────────────────────────────────────
function buildWeekGrid() {
  const grid = document.getElementById('weekGrid');
  let html = '';
  for (let w = 1; w <= 12; w++) {
    const gymData  = GYM_DAYS.some(d => d.exercises.some((ex, ei) =>
      Array.from({length:ex.sets},(_,s)=>load(key(w,'gym',d.id,ei,s,'w'))).some(Boolean)));
    const homeData = HOME_DAYS.some(d => d.exercises.some((ex, ei) =>
      Array.from({length:ex.sets},(_,s)=>load(key(w,'home',d.id,ei,s,'w'))).some(Boolean)));
    const locInd = gymData && homeData ? '🏋️🏠' : gymData ? '🏋️' : homeData ? '🏠' : '';
    html += `<button class="week-select-btn${w===currentWeek?' active':''}" onclick="selectWeek(${w})">
      <span>${w}</span>
      ${locInd ? `<span class="wk-loc">${locInd}</span>` : ''}
    </button>`;
  }
  grid.innerHTML = html;
}
function openWeekModal() { buildWeekGrid(); document.getElementById('weekModal').classList.add('open'); }
function closeWeekModal(e) { if (e.target.id==='weekModal') document.getElementById('weekModal').classList.remove('open'); }
function selectWeek(w) {
  currentWeek = w;
  document.getElementById('weekBadge').textContent = `Week ${w}`;
  document.getElementById('weekModal').classList.remove('open');
  loadLocationForDay();
  buildWorkout();
  if (currentView==='progress') buildProgress();
}

function switchDay(id) {
  currentDay = id;
  buildTabs();
  loadLocationForDay();
  buildWorkout();
}

function switchView(view) {
  currentView = view;
  document.getElementById('viewWorkout').classList.toggle('active', view==='workout');
  document.getElementById('viewProgress').classList.toggle('active', view==='progress');
  document.getElementById('navWorkout').classList.toggle('active', view==='workout');
  document.getElementById('navProgress').classList.toggle('active', view==='progress');
  if (view==='progress') buildProgress();
}

// Init
buildTabs();
loadLocationForDay();
buildWorkout();

// Register service worker for offline support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
